<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Thalwil – Retro Future Departures</title>
<style>
  :root{
    --bg:#ffffff;
    --fg:#000000;
    --muted:#555555;
    --line:#000000;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--fg);
    font-family:"Courier New", Courier, monospace;
  }

  body{
    min-height:100vh;
  }

  .wrap{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:8px;
  }

  .top{
    border:4px solid var(--line);
    padding:7px 10px 6px;
    margin-bottom:7px;
    text-align:center;
  }

  .eyebrow{
    font-size:10px;
    letter-spacing:2px;
    font-weight:700;
    text-transform:uppercase;
    margin-bottom:3px;
  }

  .station{
    font-size:21px;
    line-height:1;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .subtitle{
    margin-top:2px;
    font-size:8px;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .panel-head{
    display:grid;
    grid-template-columns:72px 1fr 58px;
    gap:8px;
    border-top:4px solid var(--line);
    border-bottom:4px solid var(--line);
    padding:4px 0;
    font-size:9px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .row{
    display:grid;
    grid-template-columns:72px 1fr 58px;
    gap:8px;
    align-items:stretch;
    border-bottom:3px solid var(--line);
    padding:5px 0;
  }

  .timebox{
    border:3px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 2px;
    min-height:46px;
  }

  .time{
    font-family:"Courier New", Courier, monospace;
    font-size:21px;
    font-weight:700;
    letter-spacing:1px;
  }

  .main{
    border-left:3px solid var(--line);
    border-right:3px solid var(--line);
    padding:4px 7px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:0;
  }

  .route{
    line-height:1.1;
  }

  .linecode{
    display:inline-block;
    border:3px solid var(--line);
    padding:1px 5px;
    margin-right:6px;
    font-size:15px;
    font-weight:700;
    vertical-align:middle;
  }

  .dest{
    font-size:16px;
    font-weight:700;
    text-transform:uppercase;
    vertical-align:middle;
    word-break:break-word;
  }

  .meta{
    margin-top:3px;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
  }

  .platform{
    border:3px solid var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-height:46px;
  }

  .platform .label{
    font-size:8px;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .platform .value{
    margin-top:2px;
    font-size:17px;
    font-weight:700;
  }

  .footer{
    margin-top:7px;
    border:4px solid var(--line);
    padding:5px 7px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1px;
  }

  .status{
    font-size:8px;
    padding:18px 0;
  }

  .error{
    border:4px solid var(--line);
    padding:20px;
    font-size:18px;
    line-height:1.4;
    text-transform:uppercase;
  }

  @media (max-width:520px){
    .wrap{padding:5px;}
    .top{padding:5px 7px 4px; margin-bottom:5px; border-width:3px;}
    .eyebrow{font-size:8px; letter-spacing:1px; margin-bottom:2px;}
    .station{font-size:27px; letter-spacing:1px;}
    .subtitle{font-size:9px; margin-top:3px; letter-spacing:1px;}
    .panel-head{
      grid-template-columns:66px 1fr 52px;
      gap:4px;
      padding:3px 0;
      font-size:8px;
      border-top-width:3px;
      border-bottom-width:3px;
    }
    .row{
      grid-template-columns:66px 1fr 52px;
      gap:4px;
      padding:4px 0;
      border-bottom-width:2px;
    }
    .timebox{min-height:42px; padding:2px; border-width:2px;}
    .time{font-size:19px;}
    .main{
      padding:3px 5px;
      border-left-width:2px;
      border-right-width:2px;
    }
    .linecode{
      font-size:13px;
      padding:1px 4px;
      margin-right:4px;
      border-width:2px;
    }
    .dest{font-size:14px;}
    .meta{font-size:8px; margin-top:2px; letter-spacing:0;}
    .platform{min-height:42px; border-width:2px;}
    .platform .label{font-size:7px;}
    .platform .value{font-size:15px; margin-top:1px;}
    .footer{
      margin-top:5px;
      padding:3px 5px;
      font-size:8px;
      border-width:3px;
      flex-direction:row;
    }
  }

  @media (orientation: landscape) {
    .wrap{
      max-width:none;
      padding:5px 8px;
    }

    .top{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      padding:4px 8px;
      margin-bottom:4px;
      min-height:40px;
    }

    .eyebrow{
      text-align:left;
      margin:0;
      font-size:8px;
      letter-spacing:1px;
    }

    .station{
      font-size:26px;
      line-height:1;
      text-align:center;
      white-space:nowrap;
    }

    .subtitle{
      text-align:right;
      margin:0;
      font-size:8px;
      letter-spacing:1px;
      white-space:nowrap;
    }

    .panel-head{
      grid-template-columns:72px 82px 1fr 54px 82px;
      gap:4px;
      padding:3px 0;
      font-size:8px;
    }

    .panel-head .head-time{grid-column:1;}
    .panel-head .head-line{grid-column:2;}
    .panel-head .head-dest{grid-column:3;}
    .panel-head .head-track{grid-column:4;}
    .panel-head .head-status{grid-column:5;}

    .row{
      grid-template-columns:72px 82px 1fr 54px 82px;
      gap:4px;
      padding:3px 0;
      align-items:center;
    }

    .timebox{
      min-height:38px;
      padding:1px 2px;
    }

    .time{
      font-size:19px;
    }

    .main{
      display:contents;
    }

    .route{
      display:contents;
    }

    .linecode{
      grid-column:2;
      margin:0;
      text-align:center;
      font-size:13px;
      padding:2px 3px;
    }

    .dest{
      grid-column:3;
      font-size:14px;
      line-height:1;
      padding-left:4px;
    }

    .meta{
      grid-column:5;
      margin:0;
      font-size:8px;
      text-align:center;
      line-height:1.1;
    }

    .platform{
      grid-column:4;
      min-height:38px;
    }

    .platform .label{
      font-size:7px;
    }

    .platform .value{
      font-size:15px;
      margin-top:1px;
    }

    .footer{
      margin-top:4px;
      padding:3px 6px;
      font-size:8px;
      flex-direction:row;
    }
  }


  /* Clean Tolino landscape refinements */
  .timebox{
    border:0 !important;
    min-height:0 !important;
    justify-content:flex-start !important;
  }

  .linecode{
    border:0 !important;
  }

  .platform{
    border:0 !important;
    min-height:0 !important;
    justify-content:flex-start !important;
    align-self:start !important;
    padding-top:1px !important;
  }

  .platform .label{
    display:none !important;
  }

  .platform .value{
    margin-top:0 !important;
    line-height:1 !important;
  }

  @media (orientation: landscape) {
    .row{
      align-items:start;
    }

    .timebox{
      padding-top:1px !important;
    }

    .linecode{
      padding-top:1px !important;
    }

    .dest{
      padding-top:1px;
    }

    .platform{
      padding-top:1px !important;
    }
  }


  @media (orientation: landscape) {
    .dest,
    .platform,
    .platform .value {
      align-self:start !important;
      margin:0 !important;
      padding-top:0 !important;
      line-height:16px !important;
    }

    .dest,
    .platform .value {
      font-size:14px !important;
      height:16px !important;
    }

    .platform {
      display:block !important;
      text-align:center !important;
      height:16px !important;
    }
  }


  @media (orientation: landscape) {
    .row {
      position: relative !important;
      align-items: start !important;
    }

    .dest {
      display: block !important;
      margin: 0 !important;
      padding: 0 0 0 4px !important;
      font-size: 14px !important;
      line-height: 16px !important;
      height: 16px !important;
    }

    .platform {
      display: block !important;
      position: relative !important;
      top: 0 !important;
      transform: translateY(-1px) !important;
      margin: 0 !important;
      padding: 0 !important;
      height: 16px !important;
      min-height: 16px !important;
      line-height: 16px !important;
      text-align: center !important;
    }

    .platform .value {
      display: block !important;
      margin: 0 !important;
      padding: 0 !important;
      font-size: 14px !important;
      line-height: 16px !important;
      height: 16px !important;
      vertical-align: top !important;
    }
  }

</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow">Temporal Transit Interface</div>
    <div class="station">THALWIL</div>
    <div class="subtitle">Next Departures // Destination Timeline</div>
  </div>

  <div class="panel-head">
    <div class="head-time">Time</div>
    <div class="head-line">Line</div>
    <div class="head-dest">Destination</div>
    <div class="head-track">Track</div>
    <div class="head-status">Status</div>
  </div>

  <div id="board">
    <div class="status">Synchronising timetable...</div>
  </div>

  <div class="footer">
    <div id="status">System online</div>
    <div>88 MPH // Rail Mode</div>
  </div>
</div>

<script>
(function () {
  var API = "https://transport.opendata.ch/v1/stationboard?station=Thalwil&limit=4";
  var board = document.getElementById("board");
  var status = document.getElementById("status");

  function pad(n) {
    return n < 10 ? "0" + n : "" + n;
  }

  function hhmm(value) {
    if (!value) return "--:--";
    var d = new Date(value);
    if (isNaN(d.getTime())) return "--:--";
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function getDelay(stop) {
    try {
      if (!stop || !stop.departure || !stop.prognosis || !stop.prognosis.departure) return null;
      var planned = new Date(stop.departure).getTime();
      var actual = new Date(stop.prognosis.departure).getTime();
      if (isNaN(planned) || isNaN(actual)) return null;
      var mins = Math.round((actual - planned) / 60000);
      return mins > 0 ? mins : 0;
    } catch(e) {
      return null;
    }
  }

  function render(data) {
    var items = data && data.stationboard ? data.stationboard : [];
    if (!items.length) {
      board.innerHTML = '<div class="error">No departures detected.</div>';
      return;
    }

    var html = "";
    for (var i = 0; i < items.length; i++) {
      var x = items[i] || {};
      var stop = x.stop || {};
      var delay = getDelay(stop);
      var line = x.number || x.name || x.category || "–";
      var dest = x.to || "–";
      var platform = stop.platform || "–";
      var meta = delay && delay > 0 ? "Delay +" + delay + " min" : "On schedule";

      html +=
        '<div class="row">' +
          '<div class="timebox"><div class="time">' + escapeHtml(hhmm(stop.departure)) + '</div></div>' +
          '<div class="main">' +
            '<div class="route">' +
              '<span class="linecode">' + escapeHtml(line) + '</span>' +
              '<span class="dest">' + escapeHtml(dest) + '</span>' +
            '</div>' +
            '<div class="meta">' + escapeHtml(meta) + '</div>' +
          '</div>' +
          '<div class="platform">' +
            '<div class="label">Track</div>' +
            '<div class="value">' + escapeHtml(platform) + '</div>' +
          '</div>' +
        '</div>';
    }

    board.innerHTML = html;

    var now = new Date();
    status.innerHTML =
      "Last sync " + pad(now.getHours()) + ":" + pad(now.getMinutes()) +
      " // Auto refresh 60s";
  }

  function loadBoard() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", API, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          render(JSON.parse(xhr.responseText));
        } catch (e) {
          board.innerHTML = '<div class="error">Timetable data unreadable.</div>';
        }
      } else {
        board.innerHTML = '<div class="error">Connection lost. Check Wi-Fi.</div>';
      }
    };
    xhr.onerror = function () {
      board.innerHTML = '<div class="error">Connection lost. Check Wi-Fi.</div>';
    };
    xhr.send();
  }

  loadBoard();
  window.setInterval(loadBoard, 60000);
})();
</script>
</body>
</html>
